name: e2e

on:
  pull_request:
    paths-ignore: ['**.md']
  # main runs check every merge and save the caches PR runs can restore (a PR can't read another PR's caches)
  push:
    branches: [main]
    paths-ignore: ['**.md']
  # nightly: backend/frontend at their latest main instead of the pinned commits, to catch a submodule
  # change that breaks e2e before the monorepo pointer is bumped
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:
    inputs:
      submodule_heads:
        description: Test backend/frontend at their latest main instead of the pinned commits
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The suite runs in 3 shards, each on its own runner with its OWN full stack (Postgres, Redis, backend, worker,
  # seed, frontend), so shards never share demo-clinic state. Each shard writes a blob report; merge-reports joins
  # them into one HTML report, and the `playwright` job at the end is the single pass/fail check.
  shard:
    name: playwright shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # a red shard must not cancel the others: the merged report shows every failure
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clinical_mind_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d clinical_mind_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis: # rate-limit counters
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      API_URL: http://localhost:8000
      WEB_URL: http://localhost:3000
      E2E_EMAIL: demo@clinicalmind.com
      E2E_PASSWORD: Password123!
      CI: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }} # PAT with read access to the private submodule repos
          persist-credentials: false # keep the PAT out of .git/config while third-party installs run

      - name: Backend at latest main (nightly)
        if: github.event_name == 'schedule' || inputs.submodule_heads
        uses: actions/checkout@v4
        with:
          repository: dikshantctin/clinicalminds-backend
          path: backend
          token: ${{ secrets.SUBMODULES_TOKEN }}
          persist-credentials: false

      - name: Frontend at latest main (nightly)
        if: github.event_name == 'schedule' || inputs.submodule_heads
        uses: actions/checkout@v4
        with:
          repository: dikshantctin/clinicalminds-frontend
          path: frontend
          token: ${{ secrets.SUBMODULES_TOKEN }}
          persist-credentials: false

      - name: Commits under test
        run: git submodule status

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Backend .env (throwaway secrets generated per run)
        working-directory: backend
        run: |
          cat > .env <<EOF
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/clinical_mind_db
          REDIS_URL=redis://localhost:6379/0
          ENVIRONMENT=test  # not development: no default-tenant fallback, so requests must carry their tenant as in production
          DEBUG=false
          SECRET_KEY=$(openssl rand -hex 32)
          JWT_SECRET_KEY=$(openssl rand -hex 32)
          ALLOWED_HOSTS=localhost,127.0.0.1
          PLATFORM_ORIGIN=http://localhost:3000
          PORTAL_BASE_URL=http://localhost:3000
          PAYMENTS_ENABLED=true
          PAYMENTS_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr "+/" "-_")  # Fernet key: url-safe base64 of 32 bytes
          ANTHROPIC_API_KEY=unused-in-ci
          OPENAI_API_KEY=unused-in-ci
          EMAIL_OUTBOX_DIR=.email-outbox
          RATE_LIMIT_IP_SCALE=100  # every spec shares one IP; per-account limits stay at production values
          # dev/test only (empty by default, refused in production): proven without phone.email, each for its own channel
          VERIFICATION_TEST_EMAILS=demo@clinicalmind.com,dr.smith@democlinic.com,therapist.jane@democlinic.com,patient.demo@democlinic.com,@example.com
          VERIFICATION_TEST_PHONES=+919876543210,+919876543211
          EOF

      # the whole venv, not just pip's download cache: a hit skips the install entirely
      - name: Cache backend venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install backend
        working-directory: backend
        run: |
          if [ '${{ steps.venv-cache.outputs.cache-hit }}' != 'true' ]; then
            python -m venv .venv
            .venv/bin/pip install -r requirements.txt
          fi
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The tenant schema comes from migrations alone, as a fresh production database would, so a model change
      # with no revision fails here (a create_all schema once hid that tasktype lacked PATIENT_FOLLOWUP).
      - name: Alembic upgrade head (builds the tenant schema from an empty database)
        working-directory: backend
        run: alembic upgrade head && alembic current

      - name: Start backend (startup create_all builds the platform schema; the tenant schema already exists)
        working-directory: backend
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/health && exit 0; sleep 2; done
          cat /tmp/backend.log; exit 1

      - name: Start follow-up worker (Celery + beat; keeps the follow-up queue current, app/worker)
        working-directory: backend
        run: |
          nohup celery -A app.worker.celery_app worker -B --concurrency=1 --loglevel=info > /tmp/worker.log 2>&1 &
          for i in $(seq 1 30); do grep -q "ready" /tmp/worker.log && exit 0; sleep 1; done
          cat /tmp/worker.log; exit 1

      - name: Seed demo clinic + demo rows
        working-directory: backend
        run: |
          python scripts/setup_demo_data.py
          python scripts/demo_data.py import scripts/fixtures/demo_clinic.json
          # the seed never grants platform staff (its password is in the repo); the /docs specs need one
          python scripts/platform_staff.py grant platform.staff@example.com --by e2e-ci

      - name: Connect the demo clinic's Razorpay TEST account (the payments specs skip without one)
        working-directory: backend
        env:
          RAZORPAY_KEY_ID: ${{ secrets.E2E_RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.E2E_RAZORPAY_KEY_SECRET }}
        run: |
          if [ -z "$RAZORPAY_KEY_ID" ] || [ -z "$RAZORPAY_KEY_SECRET" ]; then
            echo "::notice::E2E_RAZORPAY_* secrets not available to this run; the payments specs will skip"
            exit 0
          fi
          # stdout names the key id and the secret's last 4 characters: keep both out of the log
          python scripts/connect_demo_razorpay.py > /dev/null

      - name: Start frontend (production bundle, as shipped)
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: |
          npm ci
          npx vite build  # no tsc: frontend CI already type-checks
          nohup npx vite preview > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000 && exit 0; sleep 2; done
          cat /tmp/frontend.log; exit 1

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          if [ '${{ steps.pw-cache.outputs.cache-hit }}' = 'true' ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Playwright (api + web)
        working-directory: e2e
        env:
          # the optional "validate a fresh pair" write-path specs (Razorpay TEST mode)
          E2E_RAZORPAY_KEY_ID: ${{ secrets.E2E_RAZORPAY_KEY_ID }}
          E2E_RAZORPAY_KEY_SECRET: ${{ secrets.E2E_RAZORPAY_KEY_SECRET }}
        run: npx playwright test --project=api --project=web --shard=${{ matrix.shard }}/3 --reporter=list,blob

      - name: Service logs
        if: failure()
        run: |
          tail -n 200 /tmp/backend.log || true
          tail -n 100 /tmp/worker.log || true
          tail -n 100 /tmp/frontend.log || true

      # the blob holds this shard's results with their traces and screenshots; merge-reports builds the HTML from it
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 1

  merge-reports:
    needs: shard
    if: ${{ !cancelled() }} # merge whatever the shards produced, red ones included
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4 # e2e/ only: merging needs the same @playwright/test version, not the submodules
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright (no browsers)
        working-directory: e2e
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: e2e/all-blob-reports
          merge-multiple: true

      - name: Merge the shard reports into one HTML report
        working-directory: e2e
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The one check name mergePRS (and any branch protection) reads: green only when every shard and the merge passed.
  playwright:
    needs: [shard, merge-reports]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed
        env:
          SHARDS: ${{ needs.shard.result }}
          MERGE: ${{ needs.merge-reports.result }}
        run: |
          echo "shards: $SHARDS, merge-reports: $MERGE"
          [ "$SHARDS" = success ] && [ "$MERGE" = success ]
