name: e2e

on:
  pull_request:
    paths-ignore: ['**.md']
  # main runs check every merge and save the caches PR runs can restore (a PR can't read another PR's caches)
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clinical_mind_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d clinical_mind_db"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      API_URL: http://localhost:8000
      WEB_URL: http://localhost:3000
      E2E_EMAIL: demo@clinicalmind.com
      E2E_PASSWORD: Password123!
      CI: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }} # PAT with read access to the private submodule repos
          persist-credentials: false # keep the PAT out of .git/config while third-party installs run

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Backend .env (throwaway secrets generated per run)
        working-directory: backend
        run: |
          cat > .env <<EOF
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/clinical_mind_db
          REDIS_URL=redis://localhost:6379/0  # required setting; nothing connects to it
          ENVIRONMENT=test  # not development: no default-tenant fallback, so requests must carry their tenant as in production
          DEBUG=false
          SECRET_KEY=$(openssl rand -hex 32)
          JWT_SECRET_KEY=$(openssl rand -hex 32)
          ALLOWED_HOSTS=localhost,127.0.0.1
          PLATFORM_ORIGIN=http://localhost:3000
          PORTAL_BASE_URL=http://localhost:3000
          PAYMENTS_ENABLED=true
          PAYMENTS_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr "+/" "-_")  # Fernet key: url-safe base64 of 32 bytes
          ANTHROPIC_API_KEY=unused-in-ci
          OPENAI_API_KEY=unused-in-ci
          EMAIL_OUTBOX_DIR=.email-outbox
          EOF

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend (startup create_all builds the platform + tenant schema)
        working-directory: backend
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/health && exit 0; sleep 2; done
          cat /tmp/backend.log; exit 1

      - name: Alembic (schema came from create_all, so stamp rather than replay migrations)
        working-directory: backend
        run: alembic stamp head && alembic current

      - name: Seed demo clinic + demo rows
        working-directory: backend
        run: |
          python scripts/setup_demo_data.py
          python scripts/demo_data.py import scripts/fixtures/demo_clinic.json

      - name: Start frontend (production bundle, as shipped)
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: |
          npm ci
          npx vite build  # no tsc: frontend CI already type-checks
          nohup npx vite preview > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000 && exit 0; sleep 2; done
          cat /tmp/frontend.log; exit 1

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          if [ '${{ steps.pw-cache.outputs.cache-hit }}' = 'true' ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Playwright (api + web)
        working-directory: e2e
        run: npx playwright test --project=api --project=web

      - name: Service logs
        if: failure()
        run: |
          tail -n 200 /tmp/backend.log || true
          tail -n 100 /tmp/frontend.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
